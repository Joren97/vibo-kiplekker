name: "PROD - Build and deploy"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ASTRO_OUTPUT: static

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            dist/**
          retention-days: 3